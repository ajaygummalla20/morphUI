name: Deploy configured Cloudflare pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-pilot
  cancel-in-progress: false
jobs:
  deploy:
    environment: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MORPH_DEPLOY_WORKER_NAME: ${{ vars.MORPH_DEPLOY_WORKER_NAME }}
      MORPH_DEPLOY_DATABASE_ID: ${{ vars.MORPH_DEPLOY_DATABASE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix gateway --ignore-scripts
      - run: npm run check
      - run: node scripts/deployment-config.mjs
      - run: npx --no-install wrangler d1 migrations apply DB --remote --config .deploy.generated.json
      - run: npx --no-install wrangler deploy --config .deploy.generated.json
